<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Editar Ninja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            padding: 30px;
        }
        .form-container {
            max-width: 500px;
            margin: auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Editar Ninja</h2>

    <form th:action="@{/alterar}" th:object="${ninja}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" required />

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required />

        <label for="imgUrl">Imagem (URL)</label>
        <input type="text" id="imgUrl" th:field="*{imgUrl}" />

        <label for="rank">Rank</label>
        <select id="rank" th:field="*{rank}">
            <option value="Genin">Genin</option>
            <option value="Chunin">Chunin</option>
            <option value="Jounin">Jounin</option>
            <option value="Kage">Kage</option>
        </select>

        <label for="idade">Idade</label>
        <input type="number" id="idade" th:field="*{idade}" min="1" required />

        <label for="missoes">Missões</label>
        <textarea id="missoes" th:field="*{missoes}" rows="4"></textarea>

        <button type="submit">Salvar</button>
    </form>
</div>
</body>
</html>
